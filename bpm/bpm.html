<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
        style-src 'self' 'unsafe-inline';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' data:;
        font-src 'self' data:">
    <meta property="og:url" content="https://pages.certseeds.com/bpm/bpm.html">
    <meta property="og:site_name" content="Programmable-BPM">
    <meta property="og:title" content="Programmable-BPM">
    <meta property="og:description" content="A Programmable BPM page">
    <meta property="og:locale" content="zh-CN">
    <meta property="og:type" content="website">

    <link rel="author" href="http://blog.certseeds.com/" title="Certseeds">
    <link rel="me" href="http://blog.certseeds.com/" title="Certseeds">

    <meta property="dc.creator" name="author" content="Certseeds">
    <meta property="dc.description" name="description" content="A Programmable BPM page">
    <meta property="dc.identifier" name="url" content="https://pages.certseeds.com/bpm/bpm.html">
    <meta property="dc.relation" content="https://pages.certseeds.com/bpm/bpm.html">
    <meta property="dc.language" name="language" content="zh-CN">
    <meta property="dc.rights" name="copyright" content="Certseeds publish it under AGPL-3.0-or-later">
    <meta property="dc.subject" name="keywords" content="spa,frontend,html,css,js,webaudio">

    <title>Programmable-BPM</title>
    <style>
        /* 简单的样式，使按钮居中显示 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /* 使元素垂直排列 */
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #playButton,
        #readButton {
            padding: 15px 30px;
            font-size: 16px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 10px;
            /* 添加按钮之间的间距 */
        }

        #playButton:hover,
        #readButton:hover {
            background-color: #1558b0;
        }

        #inputBox {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 300px;
            /* 设置输入框宽度 */
            height: 200px;
            /* 设置输入框高度 */
            margin: 10px;
        }

        .blue {
            background-color: #0D407F;
            /* Ultramarine */
        }

        .red {
            background-color: #8A0303;
            /* BloodRed */
        }

        #circle {
            width: 50px;
            height: 50px;
            background-color: orange;
            border-radius: 50%;
            margin: 50px auto;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            5% {
                transform: scale(0.95);
                /* 放大到1.5倍 */
            }

            50% {
                transform: scale(1.5);
                /* 放大到1.5倍 */
            }

            90% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<script src="https://pages.certseeds.com/resource/petite-vue.iife.js" defer init></script>

<body v-scope="BPMApp()" @vue:mounted="mounted">
    <button @click="playButtonClick">播放声音</button>
    <div class="display">BPM: <span>{{ displayBpm }}</span></div>
    <div class="display">剩余步数: <span>{{ stepsRemaining }}</span></div>
    <div class="display">慢速模式: <span :style="{ color: slowSteps ? '#dc3545' : '#28a745', fontWeight: 'bold' }">{{
            slowSteps ? '开启' : '关闭' }}</span></div>
    <!-- 新增: 显示 listOfMillsAndTimes 的列表 -->
    <div class="display">
        <div>当前序列:</div>
        <ul style="text-align: left; max-width: 400px; margin: 10px auto; font-size: 14px;">
            <li v-for="(item, index) in sequenceDisplay" :key="index" :style="item.style">{{ item.text }}</li>
        </ul>
    </div>
    <textarea v-model="inputText" placeholder="bpm and minutes per line" rows="10"></textarea>
    <button @click="readInput">读取输入</button>
    <button @click="toggleSound" :class="isSoundOn ? 'red' : 'blue'">开关声音</button>
    <!-- 添加一个橙色圆 -->
    <div id="circle" :style="{ animation: circleAnimation }"></div>
    <script>
        // 纯函数: 不依赖组件状态,可以提取到外部
        const createSound = (ac, K, N) => {
            const T = ac.sampleRate;
            const M = T * 0.1;
            const L = ac.createBuffer(1, M, T);
            const e = L.getChannelData(0);
            const S = 2 * Math.PI / T * K;
            const R = 100 / T;
            const P = 200 / T;
            const O = 500 / T;

            for (let Q = 0; Q < M; Q++) {
                e[Q] = N * (0.09 * Math.exp(-Q * R) * Math.sin(S * Q)
                    + 0.34 * Math.exp(-Q * P) * Math.sin(2 * S * Q)
                    + 0.57 * Math.exp(-Q * O) * Math.sin(6 * S * Q));
            }
            return L;
        };

        const parseInput = (text) => {
            const lines = text.split('\n');
            const result = lines
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map((line) => {
                    const parts = line.split(' ');
                    const bpm = parseFloat(parts[0], 10);
                    const mills = parseFloat(parts[1], 10) * 60;
                    const betweenMills = Math.ceil(60 * 1000 / bpm);
                    const times = Math.floor(bpm * mills / 60);
                    return {
                        mills: betweenMills,
                        times: times
                    };
                });
            return result;
        };

        const BPMApp = () => {
            const _default = [{
                mills: 1000,
                times: 60
            }];

            return {
                isLocked: false,
                isSoundOn: true,
                slowSteps: false,
                dealArray: [..._default],
                bpm: 60,
                inputText: '',
                stepsRemaining: 0,
                currentSegmentIndex: 0,
                currentBeatCount: 0,
                circleAnimation: '',

                get displayBpm() {
                    const baseBpm = this.slowSteps && this.isLocked ? this.bpm / 2 : this.bpm;
                    return baseBpm.toFixed(2);
                },

                get sequenceDisplay() {
                    const result = [];
                    const remainingSteps = this.calculateRemainingSteps();

                    this.dealArray.forEach((item, index) => {
                        const baseBpm = (60000 / item.mills).toFixed(1);
                        const displayBpm = this.slowSteps && index === this.currentSegmentIndex ? (baseBpm / 2).toFixed(1) : baseBpm;
                        const minutes = (item.times * item.mills / 60000).toFixed(2);

                        let displayText = `第${index + 1}段: BPM ${displayBpm}${this.slowSteps && index === this.currentSegmentIndex ? ' (慢速)' : ''}, 时长 ${minutes}分钟`;

                        const style = {};

                        if (index < this.currentSegmentIndex) {
                            displayText += `, 已完成 ✓`;
                            style.color = '#28a745';
                            style.textDecoration = 'line-through';
                        } else if (index === this.currentSegmentIndex) {
                            const remaining = remainingSteps[index - this.currentSegmentIndex] || 0;
                            displayText += `, 剩余 ${remaining} 步`;
                            style.fontWeight = 'bold';
                            style.color = '#1a73e8';
                            style.backgroundColor = '#f0f7ff';
                            style.padding = '2px 5px';
                            style.borderRadius = '3px';
                        } else {
                            const totalSteps = remainingSteps[index - this.currentSegmentIndex] || item.times;
                            displayText += `, 待执行 ${totalSteps} 步`;
                            style.color = '#6c757d';
                        }

                        result.push({ text: displayText, style });
                    });

                    return result;
                },

                calculateRemainingSteps() {
                    const remainingSteps = [];
                    if (this.dealArray.length > 0 && this.currentSegmentIndex < this.dealArray.length) {
                        const currentSegment = this.dealArray[this.currentSegmentIndex];
                        remainingSteps.push(currentSegment.times - this.currentBeatCount - 1);
                        for (let i = this.currentSegmentIndex + 1; i < this.dealArray.length; i++) {
                            remainingSteps.push(this.dealArray[i].times);
                        }
                    }
                    return remainingSteps;
                },

                // 依赖 this 的方法: 必须保留在组件内部
                playSound(ac, sound) {
                    const playAudio = new Promise(() => {
                        const note = ac.createBufferSource();
                        note.buffer = sound;
                        note.connect(ac.destination);
                        const t = ac.currentTime;
                        note.start(t);
                        note.stop(t + 0.05);
                    });

                    const heartBpm = (((60 / this.bpm) / 2) * 0.8);
                    this.circleAnimation = `pulse ${heartBpm}s ease-in-out`;
                    setTimeout(() => {
                        this.circleAnimation = '';
                    }, heartBpm * 1000);

                    playAudio.then(() => {
                        console.log('audio done');
                    });
                },

                playWithInternal(listOfMillsAndTimes, currentSegmentIndex = 0, currentBeatCount = 0) {
                    if (listOfMillsAndTimes.length === 0 || !this.isSoundOn) {
                        console.log("playback completed or stopped");
                        this.isLocked = false;
                        return;
                    }

                    const currentSegment = listOfMillsAndTimes[currentSegmentIndex];
                    let { mills: millsBetween, times } = currentSegment;
                    if (this.slowSteps) {
                        millsBetween *= 2;
                    }

                    if (currentBeatCount === 0) {
                        console.log(`Starting segment ${currentSegmentIndex}:`, currentSegment);
                        this.bpm = this.slowSteps ? (60000 / millsBetween) : (60000 / currentSegment.mills);
                        this.isLocked = true;
                    }

                    this.currentSegmentIndex = currentSegmentIndex;
                    this.currentBeatCount = currentBeatCount;
                    this.stepsRemaining = times - currentBeatCount - 1;

                    console.log(`${millsBetween} ${times} ${currentBeatCount}`);

                    if (this.isSoundOn) {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const sound440 = createSound(audioContext, 440, 0.5);
                        this.playSound(audioContext, sound440);
                    }

                    setTimeout(() => {
                        const nextBeatCount = currentBeatCount + 1;

                        if (nextBeatCount >= times) {
                            this.isLocked = false;
                            const nextSegmentIndex = currentSegmentIndex + 1;
                            if (nextSegmentIndex < listOfMillsAndTimes.length) {
                                this.playWithInternal(listOfMillsAndTimes, nextSegmentIndex, 0);
                            } else {
                                console.log("All segments completed");
                                this.currentSegmentIndex = 0;
                                this.currentBeatCount = 0;
                            }
                        } else {
                            this.playWithInternal(listOfMillsAndTimes, currentSegmentIndex, nextBeatCount);
                        }
                    }, millsBetween);
                },

                playButtonClick() {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const sound440 = createSound(audioContext, 440, 0.5);
                    this.playSound(audioContext, sound440);
                    this.playWithInternal(this.dealArray, 0, 0);
                },

                readInput() {
                    console.log('输入的内容是:', this.inputText);
                    const parsed = parseInput(this.inputText);
                    if (parsed.length > 0) {
                        this.dealArray = parsed;
                        console.log(this.dealArray);
                    }
                },

                toggleSound() {
                    this.isSoundOn = !this.isSoundOn;
                    console.log('声音开关状态:', this.isSoundOn ? '开' : '关');
                    if (!this.isSoundOn) {
                        this.dealArray = [..._default];
                    }
                },

                handleKeydown(event) {
                    if (event.key === 'ArrowUp' || event.key === 'ArrowRight') {
                        const wasSlowSteps = this.slowSteps;
                        this.slowSteps = true;

                        if (!wasSlowSteps && this.isLocked) {
                            this.bpm = this.bpm / 2;
                        }
                        console.log('慢速模式: 开启');
                    } else if (event.key === 'ArrowDown' || event.key === 'ArrowLeft') {
                        const wasSlowSteps = this.slowSteps;
                        this.slowSteps = false;

                        if (wasSlowSteps && this.isLocked) {
                            this.bpm = this.bpm * 2;
                        }
                        console.log('慢速模式: 关闭');
                    }
                },

                mounted() {
                    document.addEventListener('keydown', this.handleKeydown.bind(this));
                }
            };
        };
    </script>
</body>

</html>
